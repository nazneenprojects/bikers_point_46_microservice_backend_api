[tool.poetry]
name = "auth-service"
version = "0.1.0"
description = "auth-service microservice helps to maintain secured authentation for this bikers_point_46 platform"
authors = ["Naz <naz18mulani@gmail.com>"]
license = "MIT"
readme = "README.md"
#requires-python = "3.13"

packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115.0"
uvicorn = "^0.34.2"
pydantic = "^2.11.4"
python-jose = {extras = ["cryptography"], version = "^3.4.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.20"
azure-cosmos = "^4.9.0"
aiokafka = "^0.12.0"
pydantic-settings = "^2.9.1"
httpx = "^0.28.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"
mypy = "^1.15.0"



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
